[project]
name = "waf-agentic-sandbox"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "ollama>=0.4",
    "boto3>=1.34",
]

[tool.vercel]
entrypoint = "main:app"

[tool.vercel.scripts]
build = "python -m scripts.generate_golden_run"
